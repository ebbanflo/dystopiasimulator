<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Mobile-first, screen-locked: viewport-fit + no user zoom so the shell
     behaves like an installed app rather than a scrolling document. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CONTINUITY">
<meta name="color-scheme" content="dark">
<title>CONTINUITY OF GOVERNMENT</title>
<!-- Assets carry a ?v= stamp so a stale browser/CDN cache cannot serve an old
     build of the CSS or JS against a new index.html. Bump these together with
     CONFIG.BUILD in config.js whenever any asset changes. -->
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<!-- ===================== SETUP / BRIEFING (own scroller) ===================== -->
<div id="screen-setup" class="screen"></div>

<!-- ============================== GAME SHELL ============================== -->
<div id="screen-game" class="screen hidden">

  <!-- ---- FIXED HEADER: identity, week, and the single COMMIT control ---- -->
  <header id="topbar">
    <div class="topbar-row">
      <span class="brand">CONTINUITY<span class="brand-dim">/GOV</span></span>
      <span id="header-seed" class="mono micro dim"></span>
    </div>

    <div class="topbar-row">
      <span id="header-date" class="mono week-readout"></span>
      <span id="header-chips" class="chips"></span>
    </div>

    <!-- The staged order. Nothing resolves until COMMIT is pressed. -->
    <div id="commitbar" class="commitbar">
      <div id="staged" class="staged">
        <span class="staged-caret">&gt;</span>
        <span id="staged-label" class="staged-label">NO ORDER SET</span>
      </div>
      <button id="commit-btn" class="commit-btn" disabled>COMMIT</button>
    </div>
  </header>

  <!-- ---- FIGURE BAR: the player, acting out whatever was just committed ---- -->
  <section id="scenebar" aria-hidden="true">
    <canvas id="scene"></canvas>
    <div id="scene-caption" class="scene-caption"></div>
  </section>

  <!-- ---- FIELD LOG: pinned under the header, types itself out weekly ---- -->
  <section id="logstrip" aria-label="Field log">
    <div class="logstrip-head">
      <span class="micro dim">FIELD LOG</span>
      <span id="log-status" class="micro dim">STANDBY</span>
    </div>
    <div id="log" role="log" aria-live="polite"></div>
    <button id="log-skip" class="log-skip hidden">TAP TO SKIP TRANSMISSION</button>
  </section>

  <!-- ---- SCROLLING CONTENT: one tab at a time ---- -->
  <main id="content">
    <div id="main-panel"></div>
  </main>

  <!-- ---- BOTTOM TAB BAR (thumb reach) ---- -->
  <nav id="tabbar" aria-label="Sections"></nav>
</div>

<!-- Load order matters: constants, RNG, world, systems, then UI. -->
<script src="config.js?v=3"></script>
<script src="rng.js?v=3"></script>
<script src="factions.js?v=3"></script>
<script src="npcs.js?v=3"></script>
<script src="flavor.js?v=3"></script>
<script src="incidents.js?v=3"></script>
<script src="events.js?v=3"></script>
<script src="threats.js?v=3"></script>
<script src="game.js?v=3"></script>
<script src="scene.js?v=3"></script>
<script src="ui.js?v=3"></script>
</body>
</html>
